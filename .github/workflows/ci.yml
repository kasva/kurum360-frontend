name: Validate
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kurum360_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE: Host=localhost;Database=kurum360_test;Username=postgres;Password=test-password
      E2E_DATABASE: Host=localhost;Database=kurum360_test;Username=postgres;Password=test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: dotnet test backend/Kurum360.Tests/Kurum360.Tests.csproj -c Release
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

